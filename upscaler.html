<!DOCTYPE html>
<html>

<head>

<title>
Gamermaid AI Image Upscaler
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1>
🖼️ AI Image Upscaler
</h1>

<p>
Make your images sharper and higher resolution.
</p>


<div class="card">

<input 
type="file" 
id="imageInput"
accept="image/*"
>


<div class="images">

    <div class="image-box">

        <h3>Original Image</h3>

        <img 
        id="preview"
        >

    </div>


    <div class="image-box">

        <h3>AI Enhanced Image</h3>

        <img 
        id="result"
        style="display:none"
        >

    </div>

</div>


<button id="process">
✨ Enhance Image
</button>


<a 
id="download"
style="display:none"
>
Download Image
</a>


</div>


</div>


<script src="script.js"></script>

</body>

</html>
