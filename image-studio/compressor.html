<!DOCTYPE html>
<html>

<head>

<title>Gamermaid Image Compressor</title>

<style>

body {
    margin:0;
    background:#0b0b12;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:40px;
}


.container {

    max-width:750px;
    margin:auto;

    background:#15151f;

    padding:40px;

    border-radius:25px;

    box-shadow:0 20px 50px rgba(0,0,0,.5);

}


h1 {

    font-size:38px;

    background:linear-gradient(
        90deg,
        #8b5cf6,
        #ec4899
    );

    -webkit-background-clip:text;
    color:transparent;

}


input, button {

    margin:15px;

    padding:15px;

    border-radius:12px;

    border:none;

}


input {

    background:#222;
    color:white;

}


button {

    background:linear-gradient(
        90deg,
        #8b5cf6,
        #ec4899
    );

    color:white;

    font-weight:bold;

    cursor:pointer;

}


img {

    max-width:90%;

    margin-top:20px;

    border-radius:15px;

}


.download {

    display:none;

    margin-top:20px;

    padding:15px 30px;

    background:#22c55e;

    color:white;

    text-decoration:none;

    border-radius:30px;

}


.info {

    color:#aaa;

    margin-top:15px;

}

</style>


</head>


<body>


<div class="container">


<h1>
🗜️ Gamermaid Image Compressor
</h1>


<p>
Reduce image size while keeping good quality.
</p>



<input 
type="file"
id="upload"
accept="image/*"
>


<br>


<label>
Quality:
</label>


<input
type="range"
id="quality"
min="10"
max="100"
value="70"
>



<br>


<button onclick="compressImage()">
Compress Image
</button>



<p class="info" id="size"></p>


<img id="preview">



<br>


<a id="download" class="download">
Download
</a>


</div>



<script>


let file;



const upload =
document.getElementById("upload");


const preview =
document.getElementById("preview");



upload.onchange = ()=>{


file =
upload.files[0];


preview.src =
URL.createObjectURL(file);


document.getElementById("size").innerText =
"Original size: "
+
(file.size / 1024).toFixed(2)
+
" KB";


};




function compressImage(){


if(!file){

alert("Upload an image first");

return;

}


const img =
new Image();


img.src =
URL.createObjectURL(file);



img.onload = ()=>{


const canvas =
document.createElement("canvas");


canvas.width =
img.width;


canvas.height =
img.height;


const ctx =
canvas.getContext("2d");



ctx.drawImage(
img,
0,
0
);



const quality =
document.getElementById("quality").value / 100;



const url =
canvas.toDataURL(
"image/jpeg",
quality
);



preview.src =
url;



const download =
document.getElementById("download");


download.href =
url;


download.download =
"gamermaid-compressed.jpg";


download.style.display =
"inline-block";


download.innerText =
"⬇️ Download Compressed Image";



fetch(url)
.then(r=>r.blob())
.then(blob=>{


document.getElementById("size").innerText =
"New size: "
+
(blob.size / 1024).toFixed(2)
+
" KB";


});



};



}



</script>


</body>

</html>
