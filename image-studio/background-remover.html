<!DOCTYPE html>
<html>

<head>

<title>
Gamermaid AI Background Remover
</title>

<script type="module">

import { pipeline } from 
"https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2";


let remover;


window.removeBG = async function(){

const file =
document.getElementById("imageInput").files[0];


if(!file){
alert("Upload an image first");
return;
}


document.getElementById("status").innerText =
"Loading AI model...";


if(!remover){

remover = await pipeline(
"image-segmentation",
"briaai/RMBG-1.4"
);

}


document.getElementById("status").innerText =
"Removing background...";


const imageURL =
URL.createObjectURL(file);


const result =
await remover(imageURL);



document.getElementById("status").innerText =
"Done!";


console.log(result);


}

</script>


<style>

body{

background:#111;
color:white;
font-family:Arial;
text-align:center;
padding:40px;

}


button{

background:#8b5cf6;
color:white;
border:0;
padding:15px 30px;
border-radius:30px;
font-size:18px;

}


</style>


</head>


<body>


<h1>
✂️ Gamermaid AI Background Remover
</h1>


<input 
type="file"
id="imageInput"
accept="image/*"
>


<br><br>


<button onclick="removeBG()">
Remove Background
</button>


<h3 id="status"></h3>


</body>


</html>
